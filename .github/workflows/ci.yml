name: CI

# Native DSP tests → compile the engine to WebAssembly → web typecheck, tests and build.
# Pushes to main also deploy the site to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: DSP tests (native C++)
        run: |
          cmake -S dsp -B dsp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build dsp/build
          ctest --test-dir dsp/build --output-on-failure

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.13

      - name: Compile the engine to WebAssembly
        run: ./scripts/build-wasm.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web typecheck, tests and build
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
